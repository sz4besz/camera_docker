services:
  camera_server:
    build: .
    network_mode: "host"
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ./:/app
    command: >
      bash -c "source /opt/ros/humble/setup.bash &&
               ros2 run realsense2_camera realsense2_camera_node --ros-args -p enable_depth:=false &
               python3 /app/image_puller.py"